name: Publish utils to DVML

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          path: utils

      - name: Checkout DVML
        uses: actions/checkout@v3
        with:
          repository: visualizedata/ml-fa25
          path: dvml
          token: ${{ secrets.DV_PUSH_TOKEN }} 


      - name: Copy files
        run: |
          cd dvml
          git rm -rf utils
          mkdir utils
          cp -r ../utils/datasets ../utils/src ./utils/
          cp ../utils/.gitignore ./utils/
          cp ../utils/README.md ./utils/
          cd ..

      - name: Push
        run: |
          cd utils
          COMMIT_MSG=utils-${{ github.ref_name }}-$(git log --format=%h -1)
          cd ../dvml
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f utils
          git commit -m $COMMIT_MSG
          git push -f origin main
